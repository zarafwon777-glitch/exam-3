<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="header">
  <div class="left">
    <div class="logo">
      <img src="./IMAGE (21).png" alt="" />
    </div>

    <div class="menu">
      <span>Home</span>
      <span>About</span>
      <span>Pages</span>
    </div>
  </div>

  <div class="right">
    <div class="cart">
      <img src="./Frame (4).png" alt="" />
      <span class="count">0</span>
    </div>

    <button class="btn">Donate now</button>
  </div>
</header>
<section class="hero">
  <div class="hero-left">
    <div class="line"></div>
    <h1 class="title">Giving help to those who need it</h1>
    <p class="text">
      Lorem ipsum dolor sit amet consectetur adipiscing eli mattis sit phasellus mollis sit aliquam sit nullam.
    </p>
    <div class="buttons">
      <button class="btn-orange">Donate now</button>
      <button class="btn-light">About our charity</button>
    </div>
  </div>

  <div class="hero-right">
    <img src="./IMAGE (22).png" alt="" />
  </div>
</section>
<section class="stats-wrap">
  <div class="stats">
    <div class="stat-item">
      <div class="stat-num">200<span>m</span></div>
      <div class="stat-label">Humans impacted</div>
    </div>

    <div class="stat-item">
      <div class="stat-num">50<span>k</span></div>
      <div class="stat-label">Collaborators</div>
    </div>

    <div class="stat-item">
      <div class="stat-num">370<span>k</span></div>
      <div class="stat-label">Donations</div>
    </div>

    <div class="stat-item">
      <div class="stat-num">100<span>+</span></div>
      <div class="stat-label">Assisted communities</div>
    </div>
  </div>
</section>
</body>
</html>
